{% extends 'base.html' %}

{% block title %}
    {% if task.id %}Modifier la Tâche - {{ task.titre }}{% else %}Créer une Tâche{% endif %}
{% endblock %}

{% block content %}
<style>
    .form-container {
        background: #ffffff;
        border-radius: 14px;
        border-top: 4px solid #7c3aed;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        padding: 35px;
    }
    .form-label-custom {
        color: #1e3a8a;
        font-weight: 600;
    }
    .form-control:focus, .form-select:focus {
        border-color: #7c3aed;
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }
    .btn-mauve {
        background-color: #7c3aed;
        color: white;
    }
    .btn-mauve:hover {
        background-color: #6d28d9;
        color: white;
    }
</style>

<div class="row justify-content-center py-4">
    <div class="col-md-8 col-lg-7">
        <div class="form-container">
            <h3 class="fw-bold mb-4" style="color: #1e3a8a;">
                {% if task.id %}
                    <i class="bi bi-pencil-square me-2"></i>Modifier la Tâche
                {% else %}
                    <i class="bi bi-list-task me-2"></i>Planifier une Nouvelle Tâche
                {% endif %}
            </h3>
            
            <form method="post">
                {% csrf_token %}
                
                <!-- Intitulé de la tâche -->
                <div class="mb-3">
                    <label for="id_titre" class="form-label form-label-custom">Intitulé de la tâche <span class="text-danger">*</span></label>
                    <input type="text" name="titre" id="id_titre" class="form-control" 
                           placeholder="Ex: Rédiger le rapport technique" 
                           value="{{ task.titre|default:'' }}" required>
                </div>

                <!-- Description / Consignes -->
                <div class="mb-3">
                    <label for="id_description" class="form-label form-label-custom">Description / Consignes</label>
                    <textarea name="description" id="id_description" class="form-control" rows="3" 
                              placeholder="Précisez les livrables attendus...">{{ task.description|default:'' }}</textarea>
                </div>

                <div class="row">
                    <!-- Associer au Projet parent -->
                    <div class="col-md-6 mb-3">
                        <label for="id_projet" class="form-label form-label-custom">Rattacher au projet <span class="text-danger">*</span></label>
                        <select name="projet" id="id_projet" class="form-select" required>
                            <option value="">-- Choisir un projet --</option>
                            {% for p in projets_disponibles %}
                                <option value="{{ p.id }}" {% if task.projet.id == p.id %}selected{% endif %}>
                                    {{ p.nom }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Assigner à un collaborateur -->
                    <div class="col-md-6 mb-3">
                        <label for="id_assignee" class="form-label form-label-custom">Assigner à (Membre)</label>
                        <select name="assignee" id="id_assignee" class="form-select">
                            <option value="">-- Non assignée (En attente) --</option>
                            {% for u in utilisateurs %}
                                <option value="{{ u.id }}" {% if task.assignee.id == u.id %}selected{% endif %}>
                                    {{ u.username }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <!-- Statut de la tâche -->
                    <div class="col-md-6 mb-3">
                        <label for="id_statut" class="form-label form-label-custom">Statut</label>
                        <select name="statut" id="id_statut" class="form-select">
                            <option value="a_faire" {% if task.statut == 'a_faire' or not task.statut %}selected{% endif %}>À faire</option>
                            <option value="en_cours" {% if task.statut == 'en_cours' %}selected{% endif %}>En cours</option>
                            <option value="termine" {% if task.statut == 'termine' %}selected{% endif %}>Terminé</option>
                        </select>
                    </div>

                    <!-- Échéance (Deadline) -->
                    <div class="col-md-6 mb-3">
                        <label for="id_deadline" class="form-label form-label-custom">Échéance (Deadline)</label>
                        <input type="date" name="deadline" id="id_deadline" class="form-control" 
                               value="{% if task.deadline %}{{ task.deadline|date:'Y-m-d' }}{% endif %}">
                    </div>
                </div>

                <div class="mt-4 pt-2 border-top d-flex justify-content-end">
                    <a href="{% if task.projet %}{% url 'projects:projet_detail' task.projet.id %}{% else %}{% url 'projects:dashboard' %}{% endif %}" class="btn btn-light border me-2">
                        <i class="bi bi-x-circle me-1"></i> Annuler
                    </a>
                    <button type="submit" class="btn btn-mauve">
                        <i class="bi {% if task.id %}bi-check-circle{% else %}bi-plus-circle{% endif %} me-1"></i> 
                        {% if task.id %}Enregistrer les modifications{% else %}Créer la tâche{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>


<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Uniquement en mode création (si aucun projet n'est encore sélectionné par défaut par l'instance)
        const projetSelect = document.getElementById('id_projet');
        if (projetSelect && projetSelect.value === "") {
            const urlParams = new URLSearchParams(window.location.search);
            const projectIdParam = urlParams.get('project');
            if (projectIdParam) {
                projetSelect.value = projectIdParam;
            }
        }
    });
</script>
{% endblock %}
