{% extends 'base.html' %}

{% block title %}Déconnexion - TaskManager UN-CHK{% endblock %}

{% block content %}
<style>
    .logout-container {
        background: #ffffff;
        border-radius: 14px;
        border-top: 4px solid #7c3aed;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        padding: 40px;
        margin-top: 50px;
    }
    .btn-reconnect {
        background-color: #1e3a8a;
        color: white;
        font-weight: 600;
        transition: all 0.3s ease;
    }
    .btn-reconnect:hover {
        background-color: #172b6b;
        color: white;
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="logout-container">
            <!-- Icône de déconnexion réussie -->
            <div class="display-4 text-success mb-3">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            
            <h3 class="fw-bold mb-2" style="color: #1e3a8a;">Session clôturée</h3>
            <p class="text-muted mb-4">Vous avez été déconnecté avec succès. Merci d'avoir utilisé notre plateforme d'apprentissage.</p>
            
            <!-- Bouton de retour rapide vers la connexion -->
            <a href="{% url 'accounts:login' %}" class="btn btn-reconnect w-100 py-2 shadow-sm">
                <i class="bi bi-box-arrow-in-right me-2"></i> Se reconnecter
            </a>
        </div>
    </div>
</div>
{% endblock %}
